name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # public/Art is the single source of truth for art assets in the repo. index.html and
      # src/*.js reference paths like "Art/foo.png" (no leading slash), so the static publish
      # needs a top-level Art/ directory — materialize it here from public/Art at deploy time
      # rather than keeping a duplicate copy committed to main.
      - name: Materialize Art/ from public/Art
        run: |
          cp -r public/Art Art
          echo "Art/ now contains $(ls Art | wc -l) files from public/Art"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,node_modules,fix_*.js,fix_*.cjs,update_*.js,update_*.cjs,reorder_*.cjs,split*.cjs,Dockerfile,docker-compose.yml,.dockerignore'
